<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MovieFlix</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
  <div class="nav-logo">MovieFlix</div>

  <div class="nav-actions">
    <button id="watchlistBtn">📌 Watch Later (<span id="watchCount">0</span>)</button>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div id="heroBg" class="hero-backdrop"></div>
  <div class="hero-overlay"></div>
  <div id="heroContent" class="hero-content"></div>
</section>

<!-- TRENDING -->
<section class="section">
  <h2>Trending</h2>
  <div id="trendingRow" class="trending-row"></div>
</section>

<!-- MOVIES -->
<section class="movies-section">
  <h2>Movies</h2>
  <div id="moviesGrid" class="movies-grid"></div>
</section>

<script src="app.js"></script>
</body>
</html>
